<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5ecdc" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17120d" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Rezar el Santo Rosario por el método tradicional, en latín y en castellano, con los misterios del día." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Rosario" />
  <title>Sanctum Rosarium</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───────────── Pantalla de inicio ───────────── -->
  <main id="home" class="screen" hidden>
    <header class="hero">
      <h1 class="fraktur">Sanctum Rosarium</h1>
      <p class="hero-sub">Método tradicional · Latín – Castellano</p>
      <div class="ornament" aria-hidden="true"></div>
    </header>

    <section class="today" aria-live="polite">
      <p class="today-date" id="today-date"></p>
      <p class="today-sugg" id="today-sugg"></p>
    </section>

    <div id="resume-box" class="resume" hidden>
      <button class="btn btn-primary" id="btn-resume" type="button"></button>
      <button class="btn-link" id="btn-discard" type="button">Empezar de nuevo</button>
    </div>

    <section class="block">
      <h2 class="block-title">Misterios</h2>
      <div class="sets" id="sets" role="radiogroup" aria-label="Misterios a rezar"></div>
      <ol class="myst-preview" id="myst-preview"></ol>
    </section>

    <section class="block">
      <h2 class="block-title">Idioma</h2>
      <div class="seg seg-wide" data-lang-control role="radiogroup" aria-label="Idioma"></div>
    </section>

    <section class="block">
      <label class="block-title" for="intention">Intención particular <span class="opt">(opcional)</span></label>
      <textarea id="intention" rows="2" maxlength="300" placeholder="Por ejemplo: por mi familia, por un enfermo…"></textarea>
    </section>

    <button class="btn btn-primary btn-start" id="btn-start" type="button">Comenzar a rezar</button>

    <footer class="home-foot">
      <p>“Las oraciones vocales del Rosario son su materia o cuerpo; la meditación de sus quince misterios son su esencia o alma.”</p>
    </footer>
  </main>

  <!-- ───────────── Pantalla de rezo ───────────── -->
  <div id="pray" class="screen pray" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btn-home" type="button" aria-label="Volver al inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar-title">
        <span id="sec-title"></span>
        <span id="sec-sub" class="topbar-sub"></span>
      </div>
      <div class="seg seg-small" data-lang-control role="radiogroup" aria-label="Idioma"></div>
      <button class="icon-btn" id="btn-menu" type="button" aria-label="Índice y ajustes" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>

    <div class="beads" id="beads" aria-hidden="true"></div>

    <main class="stage" id="stage" tabindex="-1">
      <article class="card" id="card" aria-live="polite"></article>
    </main>

    <nav class="bottombar">
      <button class="btn btn-ghost" id="btn-prev" type="button">‹ Anterior</button>
      <span class="counter" id="counter"></span>
      <button class="btn btn-primary" id="btn-next" type="button">Siguiente ›</button>
    </nav>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Índice y ajustes" hidden>
      <div class="drawer-head">
        <h2>Índice</h2>
        <button class="icon-btn" id="btn-close" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-settings">
        <div class="setting">
          <span>Tamaño de letra</span>
          <div class="seg">
            <button type="button" id="font-dec" aria-label="Letra más pequeña">A−</button>
            <button type="button" id="font-inc" aria-label="Letra más grande">A+</button>
          </div>
        </div>
        <div class="setting">
          <span>Tema</span>
          <div class="seg" id="theme-control" role="radiogroup" aria-label="Tema"></div>
        </div>
      </div>
      <ol class="toc" id="toc"></ol>
    </aside>
  </div>

  <noscript><p style="padding:2rem;text-align:center">Esta aplicación necesita JavaScript.</p></noscript>

  <script src="data/oraciones.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
